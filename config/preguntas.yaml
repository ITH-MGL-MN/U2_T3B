#  CUIDADO CON LAS BARRAS DE LaTeX, que aquí se escriben de dos formas:
#    * en un bloque `>-` (o `|`) el texto es LITERAL:  escribe \frac, \times
#    * entre comillas DOBLES ("...") la barra es un ESCAPE de YAML: hay que
#      escribir \\frac, \\times. Una barra sola NO es un error de sintaxis
#      evidente: \\f se convierte en un salto de página \x0c y \\t en un
